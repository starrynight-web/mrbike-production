# Render Blueprint Configuration (render.yaml)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mrbike-backend
    env: python
    region: singapore # or pick a region closer to your users
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4 # Update if you need a specific Python version
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        # We set sync to false so Render doesn't delete it; you must paste your Supabase DB URL in the Render dashboard manually!
        sync: false 
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "mrbikebd.com,www.mrbikebd.com,mrbike-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        # Update this later once you secure your Vercel URL
        value: "https://mrbikebd.com,https://www.mrbikebd.com"
