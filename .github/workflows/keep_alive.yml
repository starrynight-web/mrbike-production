name: Keep Backend Alive

on:
  schedule:
    # Run every 12 minutes (Render sleeps after 15m of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -I https://mrbike-backend.onrender.com/health/
