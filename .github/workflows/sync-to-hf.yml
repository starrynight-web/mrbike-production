name: Sync to Hugging Face Space

on:
  push:
    branches: [main, render-test]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a temporary deployment directory
          mkdir deploy_tmp
          
          # Copy only necessary files for the backend deployment
          cp -r backend deploy_tmp/
          cp Dockerfile deploy_tmp/
          cp .dockerignore deploy_tmp/
          
          cd deploy_tmp
          
          # Remove local database and media files to stay within HF limits
          # These should be handled by external services (PostgreSQL/Cloudinary)
          rm -f backend/db.sqlite3*
          rm -rf backend/media/*
          
          # Initialize a fresh git repository to flatten history
          git init -b main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
          git add .
          git commit -m "deploy: sync backend to Hugging Face"
          
          # Add HF remote and force push
          git remote add huggingface https://oauth:${HF_TOKEN}@huggingface.co/spaces/MrbikeBD/mrbike-backend
          git push -f huggingface main
