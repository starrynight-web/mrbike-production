name: MrBikeBD CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Tests
      run: |
        cd backend
        pytest --cov=. --cov-report=xml
      env:
        SECRET_KEY: "test-key-not-for-production"
        DATABASE_URL: "sqlite:///:memory:"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Security Tools
      run: pip install bandit safety
    - name: Run Bandit (Security Scan)
      run: bandit -r backend -ll
    - name: Run Safety (Dependency Check)
      run: safety check -r backend/requirements.txt

  lint_python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Linting Tools
      run: pip install flake8 black isort
    - name: Lint with flake8
      run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Check formatting with black
      run: black --check backend

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: Run Lint
      run: |
        cd frontend
        npm run lint
    - name: Build
      run: |
        cd frontend
        npm run build
      env:
        NEXT_PUBLIC_API_URL: "https://api.mrbikebd.com/api"
        NEXTAUTH_URL: "https://mrbikebd.com"
        NEXTAUTH_SECRET: "mock-secret-for-build"
