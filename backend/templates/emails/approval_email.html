<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: #10b981;
            color: white;
            padding: 32px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            padding: 32px;
            background: #ffffff;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #10b981;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 20px;
        }

        .footer {
            padding: 24px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            background: #f9fafb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Listing Approved!</h1>
        </div>
        <div class="content">
            <p>Hello {{ name }},</p>
            <p>Great news! Your listing <strong>"{{ listing_title }}"</strong> has been approved and is now live on MrBikeBD.</p>
            <p>You can view your listing here:</p>
            <a href="{{ listing_url }}" class="btn">View My Listing</a>
            <p style="margin-top: 24px;">Thank you for being part of our community!</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 MrBikeBD. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
