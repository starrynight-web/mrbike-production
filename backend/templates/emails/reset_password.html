<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: #ef4444;
            color: white;
            padding: 32px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            padding: 32px;
            background: #ffffff;
        }

        .button {
            display: inline-block;
            padding: 12px 32px;
            background: #ef4444;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin: 24px 0;
        }

        .status-box {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 16px;
            margin: 20px 0;
        }

        .footer {
            padding: 24px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            background: #f9fafb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Reset Your Password</h1>
        </div>
        <div class="content">
            <p>Hello {{ name }},</p>
            <p>We received a request to reset your password for your MrBikeBD account.</p>
            <div style="text-align: center;">
                <a href="{{ reset_url }}" class="button">Reset Password</a>
            </div>
            <div class="status-box">
                <p style="margin: 0; font-size: 14px;">This link will expire in <strong>10 minutes</strong>. If you
                    didn't request this, please change your password immediately.</p>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 MrBikeBD. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
